[project]
name = "marvelous-designer-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for Marvelous Designer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.26,<2",
]

[project.urls]
Repository = "https://github.com/Laboon2501/MarvelousDesigner-MCP"
Issues = "https://github.com/Laboon2501/MarvelousDesigner-MCP/issues"

[project.scripts]
md-mcp = "marvelous_designer_mcp.cli:main"
marvelous-designer-mcp = "marvelous_designer_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/marvelous_designer_mcp/__init__.py"

[tool.hatch.build]
exclude = ["data/**", "evidence/**", "docs-cache/**", "logs/**", "**/__pycache__/**", ".venv/**", "dist/**"]

[tool.hatch.build.targets.wheel.force-include]
"md_addon" = "marvelous_designer_mcp/plugin/md_addon"
"scripts/md_start_listener.py" = "marvelous_designer_mcp/plugin/scripts/md_start_listener.py"

[tool.hatch.build.targets.wheel]
packages = ["src/marvelous_designer_mcp"]
